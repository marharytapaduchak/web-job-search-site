services:
  frontend:
    build: .
    ports:
      - "8080:5173"
    depends_on:
      - json-server
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  json-server:
    image: node:18
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    command: sh -c "npx json-server@0.17.4 --watch /app/data/db.json --host 0.0.0.0 --port 3000"