services:
  api:
    restart: always
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./api
    environment:
      - POSTGRES_DB=jobs
      - POSTGRES_USER=jobs-web
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    expose:
      - 8080

  db:
    image: postgres:16-alpine
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=jobs
      - POSTGRES_USER=jobs-web
      - POSTGRES_PASSWORD=changeme
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jobs-web", "-d", "jobs"]
      interval: 3s
      timeout: 1s
      retries: 5

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  db-data:
